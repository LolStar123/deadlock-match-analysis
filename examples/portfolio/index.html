<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b20"><title>Deadlock match analysis</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./">deadlock</a><nav><a href="https://github.com/LolStar123/deadlock-match-analysis">Source</a><a href="https://lolstar123.github.io/just-a-little-further/">Atul's projects</a></nav></header>
<main>
<section class="hero"><h1>Deadlock match analysis</h1><p id="scope">Loading match archive...</p></section>
<div class="workbench">
<aside class="controls" aria-label="Define a match condition">
<h2>Condition</h2>
<label>Compare<select id="metric" disabled></select></label>
<label>Minimum lead <strong id="lead-label"></strong><input id="threshold" type="range" min="0" max="20000" step="1000" value="0" disabled></label>
<label>Match duration<select id="duration" disabled><option value="0,120">All durations</option><option value="0,25">Under 25 minutes</option><option value="25,40">25 to 40 minutes</option><option value="40,120">40 minutes or longer</option></select></label>
</aside>
<section class="analysis" aria-label="Conditional win rate">
<p id="answer" class="answer" aria-live="polite">Loading the selected condition...</p>
<section class="result"><div class="primary"><strong id="win-rate">...</strong><span>Leading team won</span></div><div><strong id="sample">...</strong><span>Matches</span></div><div><strong id="interval">...</strong><span>95% Wilson CI</span></div></section>
<p id="coverage" class="coverage"></p>
<section class="chart"><h2 id="chart-title">Win rate by lead size</h2><div id="chart"></div></section>
</section>
</div>
<details id="cohort"><summary>Inspect matches</summary><div class="cohort-head"><p id="dot-note"></p><button id="download" disabled>Export CSV</button></div><div id="dots"></div><p id="match-detail" role="status">Select a match.</p></details>
<footer><a href="https://github.com/LolStar123/deadlock-match-analysis#readme">Data &amp; method</a></footer>
</main><script type="module" src="app.mjs"></script></body></html>
